name: Release

# Cuts a release when deployable content lands on main. This is the only writer
# of VERSION, CHANGELOG.md, tags and scripts/baselines/, which is what lets a
# deployed consumer trust a single 6-byte fetch of VERSION to detect staleness.
on:
  push:
    branches: [main]

# Releases must queue, never cancel. Cancelling an in-flight release could leave
# a tag pointing at a commit whose VERSION was never pushed.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Cut release
    runs-on: ubuntu-latest
    # Loop guard, belt and braces: the release commit is authored by the Actions
    # bot and carries [skip ci]. Either condition alone would do; both together
    # mean a change to one convention cannot cause an infinite release loop.
    if: >-
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Persist the token so the later push and tag reuse it.
          persist-credentials: true

      - name: Resolve changed files for this push
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          # github.event.before is all-zeroes for the first push to a new branch
          # and can point at a commit that no longer exists after a force-push.
          # Fall back to the first-parent diff, which is the squashed merge.
          if [ -z "${BEFORE//0/}" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git show --name-only --pretty=format: "$AFTER" > /tmp/changed-files.txt
          else
            git diff --name-only "$BEFORE" "$AFTER" > /tmp/changed-files.txt
          fi
          grep -v '^$' /tmp/changed-files.txt > /tmp/changed-files.tmp || true
          mv /tmp/changed-files.tmp /tmp/changed-files.txt
          echo "Changed files:"
          sed 's/^/  /' /tmp/changed-files.txt

      - name: Compute next version
        id: next
        run: |
          set -euo pipefail
          subject="$(git log -1 --pretty=format:'%s')"
          # Pass the whole message, not just the subject: Conventional Commits
          # puts BREAKING CHANGE in the footer, so a subject-only read ships a
          # breaking change as a patch to consumers pinned to a major line.
          git log -1 --pretty=format:'%B' > /tmp/commit-body.txt
          current="$(tr -d ' \t\r\n' < VERSION)"
          prev_tag="$(git tag --list 'v*' --sort=-v:refname | head -n 1 || true)"

          # The bump size is read from the merge subject, which equals the PR
          # title only under squash-merge. Under a merge commit the subject is
          # "Merge pull request #..." and under rebase-merge it is the last
          # commit's subject, so pr-title.yml would be validating a string that
          # never reaches this job. Warn loudly rather than silently defaulting
          # to a patch, which would understate a feat or a breaking change.
          if ! printf '%s' "$subject" | grep -Eq '^[a-zA-Z]+(\([^)]*\))?!?:'; then
            echo "::warning::Merge subject '$subject' is not a Conventional Commit. \
          The repository must use squash-merge so the PR title becomes the merge subject; \
          falling back to the patch floor."
            {
              echo "> **Merge subject is not a Conventional Commit.**"
              echo "> \`$subject\`"
              echo ">"
              echo "> Bump size fell back to the patch floor. Enable squash-merge only."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          next="$(scripts/ci/next-version.sh --changed-files /tmp/changed-files.txt --subject "$subject" --body-file /tmp/commit-body.txt --latest-tag "$prev_tag")"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "prev_tag=$prev_tag" >> "$GITHUB_OUTPUT"
          if [ "$next" = "none" ]; then
            echo "No deployable content changed. Skipping release." >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "$prev_tag" ]; then
            echo "Initial release: publishing $next as-is." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Releasing $current -> $next" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail if the release tag already exists
        if: steps.next.outputs.next != 'none'
        env:
          NEXT: ${{ steps.next.outputs.next }}
        run: |
          set -euo pipefail
          # Re-releasing an existing version would move a tag consumers have
          # already pinned to, so stop rather than overwrite.
          if git rev-parse -q --verify "refs/tags/v$NEXT" >/dev/null; then
            echo "::error::Tag v$NEXT already exists. Refusing to re-release it."
            exit 1
          fi

      - name: Write VERSION, CHANGELOG and baseline
        if: steps.next.outputs.next != 'none'
        env:
          NEXT: ${{ steps.next.outputs.next }}
          PREV_TAG: ${{ steps.next.outputs.prev_tag }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NEXT" > VERSION
          # The baseline must hash the released content, so write it after
          # VERSION but from the same working tree that is about to be tagged.
          scripts/ci/write-baseline.sh "$NEXT"
          scripts/ci/write-changelog.sh "$NEXT" "$PREV_TAG"

      - name: Commit, then tag that commit
        if: steps.next.outputs.next != 'none'
        env:
          NEXT: ${{ steps.next.outputs.next }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION CHANGELOG.md "scripts/baselines/$NEXT.sha256"

          # On an initial release VERSION and the baseline are already correct
          # in the tree, so there may be nothing to commit. That is not a
          # failure - the tag still has to be created against this commit.
          if git diff --cached --quiet; then
            echo "Nothing to commit; tagging the current commit."
          else
            git commit -m "chore(release): $NEXT [skip ci]"

            # Push the commit before tagging it. Tagging first would produce a
            # tag whose tree still holds the previous VERSION, so a consumer
            # resolving the tag would download content that disagrees with the
            # version they were told to expect.
            #
            # Another release may have landed while this job queued, so rebase
            # and retry rather than failing the release outright.
            attempt=1
            until git push origin HEAD:main; do
              if [ "$attempt" -ge 3 ]; then
                echo "::error::Could not push the release commit after $attempt attempts."
                exit 1
              fi
              echo "Push rejected; rebasing onto the latest main (attempt $attempt)."
              git fetch origin main
              git rebase origin/main
              attempt=$((attempt + 1))
            done
          fi

          git tag -a "v$NEXT" -m "v$NEXT" HEAD
          git push origin "v$NEXT"

      - name: Publish GitHub release
        if: steps.next.outputs.next != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.next.outputs.next }}
        run: |
          set -euo pipefail
          # Extract just this version's section from the changelog for the notes.
          awk -v ver="## $NEXT " '
            index($0, ver) == 1 { inside = 1; next }
            /^## / && inside { exit }
            inside { print }
          ' CHANGELOG.md > /tmp/notes.md
          [ -s /tmp/notes.md ] || echo "See CHANGELOG.md." > /tmp/notes.md
          gh release create "v$NEXT" \
            --title "v$NEXT" \
            --notes-file /tmp/notes.md \
            "scripts/baselines/$NEXT.sha256#baseline-$NEXT.sha256"
