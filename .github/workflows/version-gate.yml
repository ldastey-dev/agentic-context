name: Version gate

# VERSION is owned by the release job, not by contributors. This gate enforces
# that ownership in both directions: it rejects hand-edits to the generated
# files, and it tells the reviewer exactly which version the merge will cut.
#
# No path filters: the gate must run on every pull request so it is always
# available as a required status check.
on:
  pull_request:

concurrency:
  group: version-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Version bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate diffs against the base branch, so the merge-base must be
          # reachable. A shallow clone would not contain it.
          fetch-depth: 0

      - name: Resolve changed files
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/changed-files.txt
          echo "Changed files:"
          sed 's/^/  /' /tmp/changed-files.txt

      - name: Reject hand-edits to generated files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          fail=0

          # These files are CI-owned once they exist. Creating them is a
          # legitimate one-time bootstrap - the pull request that introduces
          # versioning has to add them, and no release workflow exists yet to
          # do it. Only a change to a file that already exists on the base is a
          # hand-edit of generated content.
          exists_on_base() {
            git cat-file -e "$BASE_SHA:$1" 2>/dev/null
          }

          if grep -qx 'VERSION' /tmp/changed-files.txt && exists_on_base VERSION; then
            echo "::error file=VERSION::VERSION is written by the release workflow on merge to main. Revert your change to it - the version for this pull request is derived from its title."
            fail=1
          fi

          if grep -qx 'CHANGELOG.md' /tmp/changed-files.txt && exists_on_base CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md is generated by the release workflow. Revert your change to it - it is written from commit messages on merge."
            fail=1
          fi

          # Baselines are published per release so migrate can tell a pristine
          # file from an edited one. A hand-written baseline would silently
          # corrupt every future migration, so once any baseline exists only
          # the release job may add or change one.
          if grep -q '^scripts/baselines/' /tmp/changed-files.txt; then
            if git ls-tree -r --name-only "$BASE_SHA" -- scripts/baselines | grep -q .; then
              echo "::error::scripts/baselines/ is published by the release workflow. Do not add or edit baseline files by hand."
              fail=1
            fi
          fi

          if [ "$fail" -eq 0 ]; then
            echo "OK: no hand-edits to CI-owned files."
          fi
          exit "$fail"

      - name: Compute the version this merge will cut
        id: next
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          current="$(tr -d ' \t\r\n' < VERSION)"
          prev_tag="$(git tag --list 'v*' --sort=-v:refname | head -n 1 || true)"
          next="$(scripts/ci/next-version.sh --changed-files /tmp/changed-files.txt --subject "$PR_TITLE" --latest-tag "$prev_tag")"
          {
            echo "### Version gate"
            echo ""
            if [ "$next" = "none" ]; then
              echo "No deployable content changed. **No release will be cut** and \`VERSION\` stays at \`$current\`."
              echo ""
              echo "Deployable paths are \`core/\`, \`standards/\`, \`playbooks/\`, and the deploy, update, migrate and shared library scripts. Documentation, workflows and tests do not reach a consumer repository, so they do not earn a version."
            elif [ -z "$prev_tag" ]; then
              echo "This is the **initial release**. Merging will publish \`$next\` as-is and tag it \`v$next\`."
              echo ""
              echo "There is no earlier tag to bump from, so the version in \`VERSION\` is published unchanged rather than skipping straight past it."
            else
              echo "Merging this pull request will release **\`$next\`** (currently \`$current\`)."
              echo ""
              echo "The bump size comes from the pull request title, with a patch floor: \`feat\` gives a minor, a \`!\` marker or \`BREAKING CHANGE\` gives a major, anything else gives a patch."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "prev_tag=$prev_tag" >> "$GITHUB_OUTPUT"

      - name: Verify the computed version is releasable
        if: steps.next.outputs.next != 'none'
        env:
          NEXT: ${{ steps.next.outputs.next }}
          PREV_TAG: ${{ steps.next.outputs.prev_tag }}
        run: |
          set -euo pipefail
          . scripts/lib/common.sh
          current="$(tr -d ' \t\r\n' < VERSION)"

          # Whatever version is about to be cut, its tag must not already exist:
          # re-releasing would move a tag consumers have pinned to.
          if git rev-parse -q --verify "refs/tags/v$NEXT" >/dev/null; then
            echo "::error::Tag v$NEXT already exists. This merge would try to re-release it."
            exit 1
          fi

          if [ -z "$PREV_TAG" ]; then
            # Initial release: nothing to be greater than.
            echo "OK: initial release of $NEXT"
            exit 0
          fi

          if ! ac_semver_gt "$NEXT" "$current"; then
            echo "::error::Computed version '$NEXT' is not greater than the current '$current'. This is a bug in scripts/ci/next-version.sh."
            exit 1
          fi
          echo "OK: $current -> $NEXT"
